name: Build and deploy Jupyter Book

on:
  push:
    branches:
      - main
    # WP49: WP specs/reports under WPs/ are plain documentation -- never
    # read by any script or test at runtime (only referenced in comments/
    # docstrings; confirmed by grep before adding this), and never part of
    # the published book. A WP's own closing report-and-changelog commit
    # should not cost a ~1.5-2h full rebuild+deploy+republish of an
    # otherwise-unchanged site.
    paths-ignore:
      - "WPs/**"

permissions:
  contents: write

jobs:
  # WP50: deterministic change classifier (scripts/classify_release_change.py)
  # decides, once, how much of the release gate the rest of this workflow
  # actually needs to run. See WPs/reports/WP50_MAINTAINER_GUIDE.md for the
  # policy this implements and how to read its output.
  classify:
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.classify.outputs.gate }}
      exercises: ${{ steps.classify.outputs.exercises }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gh-pages (for the last-successful-publish marker)
        # Shallow and allowed to fail: a missing gh-pages branch (e.g. the
        # very first run ever) is exactly the "missing marker" case
        # scripts/classify_release_change.py is required to default to the
        # full gate for -- not a workflow error.
        run: git fetch origin gh-pages --depth=1 || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Classify this change
        id: classify
        run: python scripts/classify_release_change.py --format both --github-output "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: classify
    if: needs.classify.outputs.gate != 'skip'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-lite.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interactive/package-lock.json

      - name: Install frontend dependencies
        working-directory: interactive
        run: npm ci

      - name: Install and build the course-toolbar JupyterLite extension
        # Needed by every gate that builds the site (prose/exercise/full alike)
        # -- the JupyterLite build packages this extension's output regardless
        # of which exercise changed.
        working-directory: book/lite/extensions/course-toolbar
        run: |
          npm ci
          npx tsc
          jupyter labextension build --development True .

      - name: Type-check and unit-test the frontend
        if: needs.classify.outputs.gate == 'full'
        working-directory: interactive
        run: |
          npm run typecheck
          npm run test:unit

      - name: Audit production frontend dependencies
        if: needs.classify.outputs.gate == 'full'
        working-directory: interactive
        run: npm audit --omit=dev

      - name: Build the interactive widget app
        if: needs.classify.outputs.gate == 'full'
        working-directory: interactive
        run: npm run build

      - name: Validate both committed ABIDE data artifacts (offline)
        run: python scripts/export_widget_data.py --check --artifact all

      - name: Validate the JupyterLite exercise data exports (offline)
        run: |
          python scripts/export_abide_lite_data.py --check
          python scripts/export_abide_phenotypes_lite_data.py --check

      - name: Check every migrated exercise generator is not stale (offline, full gate)
        if: needs.classify.outputs.gate == 'full'
        run: |
          for n in 01 02 03 04 05 06 07 08 09; do
            python scripts/generate_exercise_${n}_notebook.py --check
            python scripts/generate_exercise_${n}_transition_page.py --check
          done
          python scripts/compute_exercise_09_svr_benchmark.py --check

      - name: Run change-aware pretest checks (prose/exercise gate only)
        # WP50: the classifier-selected generator --check(s) and
        # structural/reference unittest files for only the touched
        # exercise(s) -- see scripts/run_selected_checks.py. The full gate's
        # equivalent, broader coverage is the two steps immediately above
        # and below instead.
        if: needs.classify.outputs.gate == 'prose' || needs.classify.outputs.gate == 'exercise'
        run: python scripts/run_selected_checks.py --phase pretest

      - name: Unit-test the Python scripts (offline, full gate)
        if: needs.classify.outputs.gate == 'full'
        run: python -m unittest discover -s tests -v

      - name: Check the portable notebook is not stale (offline, full gate)
        run: python scripts/build_portable_notebook.py --check
        if: needs.classify.outputs.gate == 'full'

      - name: Install Playwright Chromium
        if: needs.classify.outputs.gate == 'full' || needs.classify.outputs.gate == 'exercise'
        working-directory: interactive
        run: npx playwright install --with-deps chromium

      - name: End-to-end test the standalone widget app
        if: needs.classify.outputs.gate == 'full'
        working-directory: interactive
        run: npx playwright test

      - name: Build Jupyter Book
        run: jupyter-book build book

      - name: Fail on notebook execution errors
        run: |
          shopt -s globstar nullglob
          reports=(book/_build/**/*.err.log)
          if (( ${#reports[@]} )); then
            echo "::error::Notebook execution-error reports were produced:"
            for f in "${reports[@]}"; do
              echo "---- $f ----"
              cat "$f"
            done
            exit 1
          fi
          echo "No notebook execution-error reports found."

      - name: Build JupyterLite (Exercises 1-9)
        run: |
          jupyter lite build \
            --config book/lite/jupyter_lite_config.json \
            --lite-dir book/lite \
            --output-dir book/_build/html/lite

      - name: End-to-end test the combined book + JupyterLite build (full gate)
        if: needs.classify.outputs.gate == 'full'
        working-directory: interactive
        run: npm run test:e2e:book

      - name: Run change-aware browser + route smoke checks (prose/exercise gate only)
        # WP50: scripts/run_selected_checks.py --phase postbuild -- targeted
        # route/notebook/download smoke checks always; the touched
        # exercise(s)' own exercise-0N-lite.spec.ts + chapterNN.spec.ts
        # Playwright specs only for the "exercise" gate (prose never needs a
        # browser at all).
        if: needs.classify.outputs.gate == 'prose' || needs.classify.outputs.gate == 'exercise'
        run: python scripts/run_selected_checks.py --phase postbuild

      - name: Upload Playwright failure evidence (book suite)
        if: failure() && (needs.classify.outputs.gate == 'full' || needs.classify.outputs.gate == 'exercise')
        uses: actions/upload-artifact@v4
        with:
          name: playwright-book-failure-evidence
          path: interactive/test-results
          retention-days: 14

      - name: Execute the portable notebook outside the repository (Exercises 1-9 only, full gate)
        # WP49/WP52: smoke_portable_notebook.py's default ("all") also
        # executes Exercise 10's portable notebook -- legacy, unpublished
        # content this release's own gate has no reason to depend on (see
        # book/_toc.yml and book/_config.yml's exclude_patterns). Scoped
        # to chapter_02, the only Exercise-1-9 notebook this script can
        # currently smoke-test at all (every other migrated exercise's
        # portable copy, Exercise 9 included, is deliberately excluded
        # from SMOKE for the documented ipywidgets.Output()/nbclient hang
        # -- see the script's own module docstring). A separate, non-
        # blocking workflow (.github/workflows/legacy-notebook-smoke.yml)
        # still runs Exercise 10's own smoke test without gating this
        # deployment. WP50: only the full gate pays for this heavier,
        # real-kernel smoke; the prose/exercise gates' own lighter
        # scripts/smoke_release_routes.py (run above) covers the targeted
        # case a single-exercise change actually needs.
        if: needs.classify.outputs.gate == 'full'
        run: python scripts/smoke_portable_notebook.py --notebook chapter_02

      - name: Publish website
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_build/html
