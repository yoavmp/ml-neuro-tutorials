title: Machine Learning for Neuroscience
author: Yoav Melamed
copyright: "2026"
logo: logo.png

execute:
  execute_notebooks: cache
  timeout: 300

repository:
  url: https://github.com/yoavmp/ml-neuro-tutorials
  path_to_book: book
  branch: main

html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true

# WP07: the sphinx-book-theme "Launch on Colab" button is intentionally NOT
# enabled. Its URL is built from `repository.branch` (main) and the canonical
# path `book/chapters/chapter_01/exercise_01.ipynb`, so it opens the embedded
# Jupyter Book notebook (iframes + MyST directives), not the portable notebook.
# The Chapter 1 opening links to the deterministic portable notebook instead:
#   book/downloads/chapter_01/exercise_01_portable.ipynb
#
# WP12: `_static/launch-buttons.js` adds the missing per-page Colab CONTROL
# (not the theme's `launch_buttons.colab_url`) as an article-header button next
# to the theme's own download button, targeting the same portable notebook the
# opening admonition links to. It is a static, explicit page -> portable-path
# map so it can never point at the canonical notebook; unmapped pages get no
# button. Chapters 1 and 3-10 use it; WP41R deliberately excludes Chapter 2
# (see the file's own comment) because its portable notebook now only exists
# on this unpushed feature branch, so the button's github.com/.../main/...
# URL would open the old pre-WP41 notebook.

# WP16: `_static/activity-resize.js` keeps each embedded activity iframe's
# height in sync with its actual content height (see the file for why a
# static `height` attribute alone cannot stay correct at every viewport
# width). Each notebook's `height="N"` attribute remains as the pre-JS
# fallback.

# The portable notebook is a downloadable artifact (served from raw GitHub on
# `main`, linked from the Chapter 1 opening), not a book page. Keep Sphinx from
# treating book/downloads/ as source so it produces no "not in any toctree"
# warning and is not published under _build/html. (Chapter 2's own portable
# notebook is the one exception -- WP41R serves it same-origin from
# book/lite/files/ instead, since book/downloads/ is not published; see
# scripts/generate_exercise_02_transition_page.py.)
exclude_patterns:
  - downloads/*
  # WP49/WP52 excluded Exercises 10-12 from the Sphinx source set entirely
  # (not just book/_toc.yml's nav), scoping the released public hub to
  # Exercises 1-9. This release (WP57/WP57R,
  # WPs/reports/WP57_RELEASE_REPORT.md) publishes Exercise 12 (a short
  # transition page, scripts/generate_exercise_12_transition_page.py,
  # pointing at the real lesson in book/lite/files/exercise_12.ipynb) and
  # titled "coming later" placeholder stubs for Exercises 10-11
  # (chapters/chapter_10/placeholder.md, chapters/chapter_11/exercise_11.md).
  - chapters/chapter_10/exercise_10.ipynb
  # Only the real, preserved legacy Exercise 10 notebook is excluded (kept
  # for later redesign, never published, not re-executed by this build's
  # "execute_notebooks: cache" step). chapter_10's own titled placeholder
  # page (chapters/chapter_10/placeholder.md) still builds normally.
  # book/lite/ is JupyterLite source material (config, notebooks copied
  # verbatim into the browser app, and a labextension with its own
  # node_modules/build tree) -- not Jupyter Book content. jupyter-lite
  # itself is built as a separate step, straight into _build/html/lite.
  - lite/*
  - lite/**

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath

# WP32: the Exercise 4 nested-cross-validation diagram is hand-built
# HTML/CSS, not a ```mermaid fenced code block -- it never used this
# extension. `sphinxcontrib.mermaid` and `myst_fence_as_directive` are kept
# enabled here for future or other Mermaid content elsewhere in the book,
# not for that diagram.
sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    myst_fence_as_directive:
      - mermaid
    html_css_files:
      - custom.css
    html_js_files:
      - sidebar-toggle-fix.js
      - launch-buttons.js
      - activity-resize.js
